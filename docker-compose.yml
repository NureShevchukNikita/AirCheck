services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Оновили шлях, куди кладемо конфіг
    ports:
      - "8080:80"
    depends_on:
      - aircheck-backend
    networks:
      - aircheck_net

  aircheck-backend:
    build: .
    volumes:
      - .:/app
    networks:
      - aircheck_net

  locust:
    image: locustio/locust
    volumes:
      - .:/mnt/locust
    ports:
      - "8089:8089"
    command: -f /mnt/locust/locustfile.py
    networks:
      - aircheck_net

networks:
  aircheck_net:
    driver: bridge